services:
  # Kept for the switch back to Postgres -- the app now reads the SQLite
  # URL in .env.docker, so this service is idle until that line is swapped.
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: challengeuser
      POSTGRES_PASSWORD: challengepass
      POSTGRES_DB: challengemanager
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      - db
    env_file:
      - .env.docker
    volumes:
      - .:/app
    ports:
      - "8000:8000"
      - "5678:5678"
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    command: python -m debugpy --listen 0.0.0.0:5678 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata: