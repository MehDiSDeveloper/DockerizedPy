{% for c in challenges %}
<a href="/views/challenges/{{ c.id }}" class="challenge-card glass explore-card">
  <div class="explore-thumb"><span data-icon="target"></span></div>
  <div class="explore-body">
    <h3>{{ c.title }}</h3>
    <p>
      <span>{{ c.category.value }}</span>
      <span data-icon="users"></span><span>{{ c.enrollments|length }}</span>
      {% if c.due_date %}<span data-icon="calendar"></span><span data-jalali="{{ c.due_date.isoformat() }}"
        data-jalali-format="day-month-year">{{ c.due_date.strftime('%Y-%m-%d') }}</span>{% endif %}
    </p>
  </div>
</a>
{% endfor %}
