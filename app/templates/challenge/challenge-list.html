{% extends "layout.html" %}
{% block content %}

<section class="hero">
  <p class="hero-eyebrow">کاوش</p>
  <h1 class="hero-title">دنبال چه چالشی هستی؟</h1>
</section>

<div class="search-bar">
  <span data-icon="search"></span>
  <input type="text" id="clSearch" placeholder="جستجوی چالش..." value="{{ query }}" />
</div>

<div class="chip-row" id="clCategoryChips" role="tablist" aria-label="فیلتر دسته‌بندی">
  <button class="chip{{ ' active' if not active_category }}" data-cat="همه" role="tab"
    aria-selected="{{ 'true' if not active_category else 'false' }}">همه</button>
  {% for cat in categories %}
  <button class="chip{{ ' active' if active_category == cat.value }}" data-cat="{{ cat.value }}" role="tab"
    aria-selected="{{ 'true' if active_category == cat.value else 'false' }}">{{ cat.value }}</button>
  {% endfor %}
</div>

<section>
  <div class="challenge-list" id="clList" data-page-size="{{ page_size }}" data-initial-count="{{ challenges|length }}"
    data-has-more="{{ 'true' if has_more else 'false' }}">
    {% include "challenge/_challenge_cards.html" %}
  </div>
  <div class="empty" id="clEmpty" {{ 'hidden' if challenges }}>
    <span data-icon="empty"></span>
    <p id="clEmptyText">هنوز چالشی ثبت نشده.</p>
  </div>
  <div class="scroll-sentinel" id="clSentinel" aria-hidden="true"></div>
  <div class="list-loading" id="clLoading" hidden><span class="spinner"></span> در حال بارگذاری...</div>
</section>

<a href="/views/challenges/create" class="fab" aria-label="ساخت چالش جدید">
  <span data-icon="plus"></span>
</a>
{% endblock %}


{% block scripts %}

<script src="{{ url_for('static', path='/js/app.js') }}"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const chipRow = document.getElementById("clCategoryChips");
    const chips = Array.from(chipRow.querySelectorAll(".chip"));
    const search = document.getElementById("clSearch");
    const listEl = document.getElementById("clList");
    const emptyEl = document.getElementById("clEmpty");
    const emptyText = document.getElementById("clEmptyText");

    let activeCat = {{ (active_category or "همه") | tojson }};
  let query = search.value.trim();

  function hasActiveFilter() {
    return activeCat !== "همه" || !!query;
  }

  function updateEmptyMessage() {
    emptyText.textContent = hasActiveFilter()
      ? "چالشی با این مشخصات پیدا نشد."
      : "هنوز چالشی ثبت نشده.";
  }

  function updateURL() {
    const params = new URLSearchParams();
    if (activeCat !== "همه") params.set("category", activeCat);
    if (query) params.set("q", query);
    const qs = params.toString();
    history.replaceState(null, "", qs ? `?${qs}` : window.location.pathname);
  }

  const scroller = createInfiniteScroller({
    container: listEl,
    sentinel: document.getElementById("clSentinel"),
    loadingEl: document.getElementById("clLoading"),
    emptyEl: emptyEl,
    pageSize: Number(listEl.dataset.pageSize) || 20,
    initialOffset: Number(listEl.dataset.initialCount) || 0,
    initialHasMore: listEl.dataset.hasMore === "true",
    buildUrl: (offset, limit) => {
      const params = new URLSearchParams({ offset, limit });
      if (activeCat !== "همه") params.set("category", activeCat);
      if (query) params.set("q", query);
      return `/views/challenges/fragment?${params.toString()}`;
    },
    onEmpty: () => {
      updateEmptyMessage();
      emptyEl.hidden = false;
    },
  });

  chips.forEach(chip => {
    chip.addEventListener("click", () => {
      if (chip.dataset.cat === activeCat) return;
      chips.forEach(c => { c.classList.remove("active"); c.setAttribute("aria-selected", "false"); });
      chip.classList.add("active");
      chip.setAttribute("aria-selected", "true");
      chip.scrollIntoView({ inline: "nearest", behavior: "smooth", block: "nearest" });
      activeCat = chip.dataset.cat;
      emptyEl.hidden = true;
      updateURL();
      scroller.reset();
    });
  });

  search.addEventListener("input", debounce(() => {
    query = search.value.trim();
    emptyEl.hidden = true;
    updateURL();
    scroller.reset();
  }, 300));
  });
</script>
{% endblock %}
