<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>چالش | خطا</title>
<link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
{#- Theme applied before first paint -- same guard as layout.html. This
    page is a standalone document (no template inheritance in this app), so
    it carries its own copy rather than inheriting one. -#}
<script>
  try {
    var t = localStorage.getItem("chalesh-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) { /* private mode: fall back to the device preference */ }
</script>
</head>
<body>
<div class="app-bg"></div>

<div class="shell">
<!-- No app.js on this page, so the back control is a plain link with an inline
     chevron; history.back() is preferred when there is a history to go back to,
     and the href is the fallback when the error page was opened cold. -->
<a href="/views/challenges/" class="back-btn floating-back" aria-label="بازگشت"
   onclick="if (history.length > 1) { history.back(); return false; }">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</a>
  <div class="auth-wrap">
    <div class="auth-logo">
      <h1>مشکلی پیش اومد</h1>
      <p>{{ error }}</p>
    </div>
    <a href="/views/challenges/" class="btn-primary" style="display:block; text-align:center;">بازگشت به فهرست چالش‌ها</a>
  </div>
</div>

</body>
</html>
