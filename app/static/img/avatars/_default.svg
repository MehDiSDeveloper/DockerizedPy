<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true"><!-- The "no pick yet" avatar. Not from DiceBear: it is drawn in the app's own
     «شن و مریم‌گلی» palette (a sage figure) so an unset member reads as part
     of the family rather than as a grey stock silhouette.

     Unlike the catalogue it has NO ground at all: the surface behind it shows
     through untouched, so it takes the page's own background — and its tile
     texture — in either theme. Only the ring and the figure are drawn.

     The figure follows the theme through a prefers-color-scheme block inside
     this file: an img cannot see [data-theme], so an explicit theme choice
     that contradicts the device preference will not reach it — the two sage
     tones are close enough that either still reads on either ground. -->
<style>
  .d-fg{fill:#6f7d73}
  @media (prefers-color-scheme:dark){.d-fg{fill:#a8ada0}}
</style>
<defs><clipPath id="d-clip"><circle cx="50" cy="50" r="50"/></clipPath></defs>
<g class="d-fg" clip-path="url(#d-clip)"><circle cx="50" cy="40" r="15.5"/><path d="M50 59c-18.4 0-33.6 13.7-35.8 31.4L13 100h74l-1.2-9.6C83.6 72.7 68.4 59 50 59Z"/></g>
<circle cx="50" cy="50" r="49.2" fill="none" stroke="#8a9a90" stroke-opacity=".3" stroke-width="1.6"/>
</svg>
