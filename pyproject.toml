# Lint configuration only. Nothing here builds or packages the app -- it is run
# with uvicorn / docker-compose and installs from requirements.txt, so there is
# deliberately no [project], [build-system], or dependency table.

[tool.ruff]
target-version = "py314"
exclude = [
    # Autogenerated Alembic boilerplate -- the revision template's typing style
    # is not ours to lint.
    "alembic/versions",
]

[tool.ruff.lint]
ignore = [
    # `def route(db: AsyncSession = Depends(get_db))` is FastAPI's documented
    # idiom: the call in the parameter default *is* the dependency declaration
    # and the framework re-evaluates it per request. B008 is a false positive
    # for every route in this codebase, so it is silenced here once instead of
    # with a `# noqa: B008` on each handler.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# `import app.models` at the bottom of the module exists for its registration
# side effect: it is what puts every model on Base.metadata for Alembic
# autogenerate. See CLAUDE.md, "Async DB access".
"app/database.py" = ["F401"]
